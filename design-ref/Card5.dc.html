</helmet>
<div style="width: 559px; height: 397px; box-sizing: border-box; border: 4px solid {{accent}}; border-radius: 18px; background: #ffffff; color: #1a1a1a; font-family: 'BIZ UDPGothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">

        <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #444444">外がわは まもりが いない ことが 多い。</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #333333; border-top: 1.5px solid #cccccc; padding-top: 6px">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7a5a12","options":["#c55a11","#11756b","#3b4cc0","#a8326e","#7a5a12"]},"$preview":{"width":559,"height":397}}'>
