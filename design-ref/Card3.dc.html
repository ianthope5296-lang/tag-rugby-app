<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作戦カード とばしパス</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1f5fae}a:hover{color:#174a88}
</style>
</helmet>
<div style="width: 559px; height: 397px; box-sizing: border-box; border: 4px solid {{accent}}; border-radius: 18px; background: #ffffff; color: #1a1a1a; font-family: 'BIZ UDPGothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 66px; background: {{accent}}; color: #ffffff; display: flex; align-items: center; gap: 14px; padding: 0 20px">
    <div style="width: 40px; height: 40px; border-radius: 20px; background: #ffffff; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">3</div>
    <span style="font-size: 40px; font-weight: 700; letter-spacing: 4px">とばしパス</span>
  </div>
  <div style="flex-grow: 1; display: flex; gap: 14px; padding: 14px 18px 14px 16px">
    <svg width="240" height="290" viewBox="0 0 240 290" role="img" aria-label="2ばんが となりの3ばんを とばして 4ばんへ パスし、4ばんが前へ走る図">
      <defs>
        <marker id="run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"></path></marker>
        <marker id="pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6336c"></path></marker>
      </defs>
      <rect x="0" y="0" width="240" height="290" fill="#dcecc9" stroke="#1a1a1a" stroke-width="2"></rect>
      <rect x="0" y="0" width="240" height="34" fill="#f6d6a8" stroke="#1a1a1a" stroke-width="2"></rect>
      <text x="120" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">トライゾーン</text>
      <path d="M60 34V262M120 34V262M180 34V262" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 5"></path>
      <path d="M0 262H240" stroke="#1a1a1a" stroke-width="3"></path>
      <path d="M30 182V156" stroke="#9a9a9a" stroke-width="3" marker-end="url(#run)"></path>
      <path d="M150 162V138" stroke="#9a9a9a" stroke-width="3" marker-end="url(#run)"></path>
      <path d="M104 148Q172 132 202 202" fill="none" stroke="#d6336c" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#pass)"></path>
      <path d="M210 202V52" stroke="#1a1a1a" stroke-width="4.5" marker-end="url(#run)"></path>
      <rect x="96" y="92" width="104" height="24" rx="12" fill="#d6336c"></rect>
      <text x="148" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">③を とばす！</text>
      <circle cx="30" cy="200" r="17" fill="#c0392b"></circle><text x="30" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
      <circle cx="90" cy="140" r="17" fill="#1f5fae"></circle><text x="90" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
      <circle cx="150" cy="180" r="17" fill="#0f7a5a"></circle><text x="150" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
      <circle cx="210" cy="220" r="17" fill="#8e44ad"></circle><text x="210" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
      <path d="M72 114l8 8-8 8-8-8z" fill="#d6336c" stroke="#1a1a1a" stroke-width="1"></path>
    </svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 20px; line-height: 1.6; font-weight: 700">②は となりの ③を とばして、その となりの ④に パス！</p>
        <p style="margin: 0; font-size: 20px; line-height: 1.6; font-weight: 700">④は ボールを もらったら 前へ 走る。</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #444444">まもりは ③に パスすると 思って いるので、④が あいている。</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #333333; border-top: 1.5px solid #cccccc; padding-top: 6px">
        <div style="display: flex; gap: 14px; align-items: center">
          <span style="display: flex; align-items: center; gap: 4px"><svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><path d="M1 5H20" stroke="#1a1a1a" stroke-width="3"></path><path d="M18 1L25 5L18 9z" fill="#1a1a1a"></path></svg>走る</span>
          <span style="display: flex; align-items: center; gap: 4px"><svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><path d="M1 5H20" stroke="#d6336c" stroke-width="3" stroke-dasharray="4 3"></path><path d="M18 1L25 5L18 9z" fill="#d6336c"></path></svg>パス</span>
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l6 6-6 6-6-6z" fill="#d6336c"></path></svg>ボール</span>
        </div>
        <span>○の 数字 ＝ さくせんボードの 立ちいち</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3b4cc0","options":["#c55a11","#11756b","#3b4cc0","#a8326e"]},"$preview":{"width":559,"height":397}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3b4cc0' };
  }
}
</script>
</body>
</html>
