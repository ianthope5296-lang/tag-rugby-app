<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作戦ボード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1f5fae}a:hover{color:#174a88}
</style>
</helmet>
<div style="width: 1587px; height: 1123px; box-sizing: border-box; padding: 48px 56px; background: #ffffff; color: #1a1a1a; font-family: 'BIZ UDPGothic', sans-serif; display: flex; gap: 48px">

  <div style="width: 880px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 700; color: #b5501f">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b5501f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4"></path><path d="M5 11l7-7 7 7"></path></svg>
      <span>こうげきする方こう</span>
    </div>
    <div style="height: 110px; background: #f6d6a8; border: 3px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; letter-spacing: 12px">トライゾーン</div>
    <div style="flex-grow: 1; border: 3px solid #1a1a1a; border-top: 0; background: #dcecc9; display: flex; flex-direction: column">
      <div style="height: 0; border-top: 3px dashed #1a1a1a; margin-top: 70px; position: relative">
        <span style="position: absolute; right: 8px; top: -30px; font-size: 18px; font-weight: 700; background: #dcecc9; padding: 0 6px">まもりのスタートライン</span>
      </div>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
        <sc-for list="{{lanes}}" as="lane" hint-placeholder-count="4">
          <div style="border-right: {{lane.edge}}; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 28px; gap: 16px">
            <div style="width: 150px; height: 150px; border-radius: 75px; background: {{lane.color}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 104px; font-weight: 700; line-height: 1">{{lane.n}}</div>
            <div style="font-size: 20px; font-weight: 700">{{lane.n}}ばん</div>
          </div>
        </sc-for>
      </div>
      <div style="height: 0; border-top: 5px solid #1a1a1a"></div>
      <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; letter-spacing: 4px">スタートライン（こうげき）</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-size: 56px; font-weight: 700; color: {{accent}}; letter-spacing: 4px">さくせんボード</h1>
    <div style="display: flex; align-items: flex-end; gap: 12px; font-size: 26px; font-weight: 700">
      <span>チーム名</span>
      <div style="flex-grow: 1; border-bottom: 3px solid #1a1a1a; height: 40px"></div>
    </div>

    <div style="width: 563px; height: 401px; box-sizing: border-box; border: 4px dashed #8a8a8a; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #555555">
      <span style="font-size: 30px; font-weight: 700">ここに さくせんカードを はろう</span>
      <span style="font-size: 18px">（えらんだ カードは あい手に 見せない）</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 24px; font-weight: 700">だれが どこに 立つ？</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 3px solid #1a1a1a">
        <sc-for list="{{lanes}}" as="lane" hint-placeholder-count="4">
          <div style="border-right: 2px solid #1a1a1a; display: flex; flex-direction: column">
            <div style="height: 44px; background: {{lane.color}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700">{{lane.n}}</div>
            <div style="height: 64px"></div>
          </div>
        </sc-for>
        <div style="display: flex; flex-direction: column">
          <div style="height: 44px; background: #3a3a3a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">かんとく</div>
          <div style="height: 64px"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1f5fae","options":["#1f5fae","#0f7a5a","#7a3fb0"]},"$preview":{"width":1587,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#c0392b', '#1f5fae', '#0f7a5a', '#8e44ad'];
    return {
      accent: this.props.accent ?? '#1f5fae',
      lanes: ['1', '2', '3', '4'].map((n, i) => ({
        n: n,
        color: colors[i],
        edge: i < 3 ? '3px dashed #1a1a1a' : '0'
      }))
    };
  }
}
</script>
</body>
</html>
